# PLACEHOLDER - replace with the organizers' price sheet
#
# Three model tiers for the router. Prices are made up but keep a realistic ratio
# (large is ~20x small), so cost-vs-accuracy trade-offs behave sensibly in development.
# Prices are per 1,000 tokens. The Ollama models are free to run locally; the prices only
# exist so the router's cost accounting can be built and tested now.

models:
  small:
    name: qwen2.5:0.5b
    provider: ollama
    price_in_per_1k: 0.0001
    price_out_per_1k: 0.0002
    currency: USD
  medium:
    name: qwen2.5:3b
    provider: ollama
    price_in_per_1k: 0.0006
    price_out_per_1k: 0.0012
    currency: USD
  large:
    name: qwen2.5:7b
    provider: ollama
    price_in_per_1k: 0.0020
    price_out_per_1k: 0.0040
    currency: USD

